<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA Acoustics</title>
    <link rel="stylesheet" href="css/gridstyle.css">
</head>
<body>
<div class="container">

    
    <header class="header">
        <h1>AURA<span>•</span></h1>
    </header>

    
    <nav class="menu">
        <a href="index.html">Home</a>
        <a href="product.html">Products</a>
    </nav>

    
    <main class="content">

       
        <section class="box">
            <h2>ยินดีต้อนรับสู่ร้านของเรา</h2>
            <p>เรามีสินค้าคุณภาพและราคาที่เหมาะสำหรับคุณ</p>

            <img src="images/shop.jpg" alt="ร้านค้า">
        </section>

     
        <section class="box">
            <h2>ร้านอยู่จังหวัดปราจีนบุรี</h2>
            <p>การเดินทางสะดวกเข้าได้สองทาง</p>

            <img src="images/map.png" alt="แผนที่">
        </section>

    </main>
<aside class="register">

        <h3>สมัครสมาชิก</h3>

        <form>

            <label>ชื่อ</label>
            <input type="text" placeholder="ชื่อจริง">

            <label>นามสกุล</label>
            <input type="text" placeholder="นามสกุล">

            <label>อีเมล</label>
            <input type="email" placeholder="example@domain.com">

            <label>รหัสผ่าน</label>
            <input type="password" placeholder="อย่างน้อย 8 ตัวอักษร">

            <label>ยืนยันรหัสผ่าน</label>
            <input type="password" placeholder="ยืนยันรหัสผ่าน">

            <label>เบอร์โทรศัพท์</label>
            <input type="tel" placeholder="083-xxx-xxxx">

            <label>เพศ</label>

            <div class="radio">
                <input type="radio" name="gender" value="male">
                <label>ชาย</label>
            </div>

            <div class="radio">
                <input type="radio" name="gender" value="female">
                <label>หญิง</label>
            </div>

            <div class="radio">
                <input type="radio" name="gender" value="other">
                <label>ไม่ระบุ</label>
            </div>

            <div class="checkbox">
                <input type="checkbox">
                รับข่าวสาร
            
            </div>

            <label>ประเภทสมาชิก</label>

            <select name="member">
                <option value="premium">Premium</option>
                <option value="vip">VIP</option>
                <option value="normal">Normal</option>
            </select>

            <div class="checkbox">
                <input type="checkbox">
                ยอมรับข้อตกลงและเงื่อนไข
            </div>

            <button type="submit">สมัครสมาชิก</button>

        </form>

        <p class="note">
            เราจะเก็บข้อมูลของคุณเป็นความลับ
        </p>

    </aside>

   
    <footer class="footer">
        <p>© 2026 AURA Acoustics Ltd. All rights reserved.</p>

        <div class="payment">
            <span>VISA</span>
            <span>◉</span>
            <span>Pay</span>
            <span>▣</span>
        </div>
    </footer>




</body>
</html>
